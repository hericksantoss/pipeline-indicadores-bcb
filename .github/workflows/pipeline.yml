name: Pipeline diário

on:
  schedule:
    # 21:00 UTC = 18:00 em Brasília, de segunda a sexta (depois do fechamento do câmbio)
    - cron: "0 21 * * 1-5"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para o bot commitar os dados atualizados

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        run: python -m pipeline.run

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "dados: atualização automática $(date -u +%Y-%m-%d)"
            git push
          fi
